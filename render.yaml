services:
  - type: web
    name: support-triage-assistant
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python app/rag/build_index.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false